[tox]
requires =
    tox>=4
    tox-uv>=1.15
env_list =
    py312
    py313
    formatter
    type
    build
skip_missing_interpreters = true

[testenv]
description = run the tests with pytest
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} -m pytest {posargs:tests}

[testenv:type]
description = run type checks
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} -m pyrefly check {posargs}

[testenv:formatter]
description = run linter
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} -m ruff check --fix {posargs:sysmlc_models tests scripts}
    {envpython} -m ruff format {posargs:sysmlc_models tests scripts}

[testenv:build]
description = build and smoke-test the distribution artifacts
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} scripts/validate_distribution.py --package sysmlc_models --dist-dir dist

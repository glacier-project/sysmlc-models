# Example configuration for the batch reactor: a sped-up single-batch
# recipe (handy for simulation runs and the test bench). Build with:
#
#   sysmlc rosetta build showcase/batch-reactor \
#     -e BatchReactor::BatchReactorBehavior \
#     --values values.yaml
BatchReactor:
  BatchReactorBehavior:
    batchTarget: 1
    inflowRate: 60.0
    heatRate: 65.0
    coolRate: 60.0
    drainRate: 60.0
    sampleTime: 0.5 [s]

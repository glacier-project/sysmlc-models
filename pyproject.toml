[project]
name = "sysmlc-models"
version = "0.0.0"
description = "SysML v2 model corpora and catalog API for the sysmlc toolchain"
authors = [{ name = "The Glacier Project contributors" }]
maintainers = [{ name = "Mario Libro", email = "mario.libro@univr.it" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "BSD-2-Clause"
dependencies = []

[project.optional-dependencies]
compiler = ["sysmlc"]
validation-quake = ["sysmlc", "sysmlc-quake"]
validation-rosetta = ["sysmlc", "sysmlc-rosetta"]
validation-statix = ["sysmlc", "sysmlc-statix"]
dev = [
    "build>=1.3.0,<2",
    "hatchling>=1.27,<2",
    "pre-commit>=4.5.1,<5",
    "pyrefly>=1.0.0",
    "ruff>=0.15.13,<0.16",
    "tox>=4.50.1,<5",
    "tox-uv>=1.15,<2",
    "pytest>=8.4.2,<10",
]

[tool.uv.sources]
sysmlc = { git = "https://github.com/glacier-project/sysmlc-core", branch = "main" }
sysmlc-quake = { git = "https://github.com/glacier-project/sysmlc-quake", branch = "main" }
sysmlc-rosetta = { git = "https://github.com/glacier-project/sysmlc-rosetta", branch = "main" }
sysmlc-statix = { git = "https://github.com/glacier-project/sysmlc-statix", branch = "main" }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sysmlc_models"]

[tool.pyrefly]
python-version = "3.12.0"
preset = "legacy"
check-unannotated-defs = true
infer-return-types = "never"
project-includes = ["sysmlc_models", "tests"]
# The bundled corpora carry their own Python fixtures; they are data, not
# part of this package's checked surface.
project-excludes = ["sysmlc_models/data"]

[tool.pyrefly.errors]
implicit-any = "error"
implicit-any-parameter = "error"
implicit-any-type-argument = "error"
implicit-any-empty-container = "error"
invalid-decorator = "error"
invalid-inheritance = "error"
missing-import = "error"
redundant-cast = "error"
redundant-condition = "error"
unannotated-return = "error"
unnecessary-comparison = "error"
unreachable = "error"
unused-ignore = "error"
untyped-import = "error"

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-type-argument = "ignore"
implicit-any-empty-container = "ignore"

[tool.ruff]
# Google style uses 80 chars
line-length = 80
target-version = "py312"
# The bundled corpora carry their own Python fixtures; never lint them.
extend-exclude = ["sysmlc_models/data"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "D",      # pydocstyle (docstring conventions)
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "TID252", # flake8-tidy-imports: ban relative imports
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by the formatter)
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # docstrings not required in tests
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["sysmlc_models"]
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not compiler and not integration'"
markers = [
    "compiler: model checks requiring core and a Syside license",
    "integration: shared scenarios requiring an installed execution backend",
]

[project]
name = "sysmlc-models"
version = "0.0.0"
description = "SysML v2 model corpora and catalog API for the sysmlc toolchain"
authors = [{ name = "Mario Libro", email = "mario.libro@univr.it" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "BSD-2-Clause"
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sysmlc_models"]

version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Rome
  open-pull-requests-limit: 10
  commit-message:
    prefix: build
    include: scope
  groups:
    python-dependencies:
      patterns:
      - '*'

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:30
    timezone: Europe/Rome
  open-pull-requests-limit: 5
  commit-message:
    prefix: ci
    include: scope
  groups:
    github-actions:
      patterns:
      - '*'

name: Set up Python and uv
description: Install the requested Python version and uv with dependency caching.
inputs:
  python-version:
    description: Python version to install.
    required: true
  git-repos-token:
    description: Token with read access to private glacier-project git dependencies.
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Set up Python
    uses: actions/setup-python@v6
    with:
      python-version: ${{ inputs.python-version }}
  - name: Install uv
    uses: astral-sh/setup-uv@v7
    with:
      enable-cache: true
      cache-dependency-glob: uv.lock
  - name: Grant read access to private git dependencies
    if: inputs.git-repos-token != ''
    shell: bash
    env:
      GIT_REPOS_TOKEN: ${{ inputs.git-repos-token }}
    run: |
      git config --global url."https://x-access-token:${GIT_REPOS_TOKEN}@github.com/glacier-project/".insteadOf "https://github.com/glacier-project/"
